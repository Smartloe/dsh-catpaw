# The row this bundle inserts into the harness tree.
#
# The model catalogue intentionally lives in index.js (`DEFAULT_MODELS`) rather
# than here: listing it twice meant an edit to one copy silently did nothing for
# everyone who already had the other. To narrow or extend the picker, add a
# `models:` list here and it wins over the built-in one — see README.
- insert:
    - id: dsh-catpaw
      name: 'dsh-catpaw'
      config:
        permissionMode: dontAsk
        excludeNativeTools: true
        systemPrompt: transcript
        maxPromptChars: 120000
        toolResultChars: 4000
